<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写真印刷シート — フィールド調べ</title>
<style>
  :root{ --bg:#0f141c; --panel:#1c2430; --accent:#ffb84d; --cell-size:30mm; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background:#fff; }
  #toolbar{
    position:sticky; top:0; z-index:2;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:12px 14px; padding-top:calc(12px + env(safe-area-inset-top));
    background:var(--panel); color:#fff;
  }
  #toolbar .title{ font-size:14px; font-weight:700; }
  #toolbar .btn{
    border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer;
    text-decoration:none; display:inline-block;
  }
  .btn-back{ background:#333d4a; color:#fff; }
  .btn-go{ background:var(--accent); color:#1a0e0a; }
  #sizeToggle, #typeToggle, #layoutToggle{ display:flex; gap:6px; background:#0f141c; border-radius:8px; padding:3px; }
  #sizeToggle .size-opt, #typeToggle .type-opt, #layoutToggle .layout-opt{
    border:none; background:transparent; color:#9aa4b2; font-size:13px; font-weight:700;
    padding:7px 12px; border-radius:6px; cursor:pointer;
  }
  #sizeToggle .size-opt.active, #typeToggle .type-opt.active, #layoutToggle .layout-opt.active{ background:var(--accent); color:#1a0e0a; }
  #status{ padding:14px; color:#555; font-size:13px; }
  #grid{
    display:flex; flex-wrap:wrap; gap:2mm;
    padding:10mm; background:#fff;
  }
  .cell{
    width:var(--cell-size); break-inside:avoid; page-break-inside:avoid;
    text-align:center; color:#000;
  }
  .cell img{
    width:var(--cell-size); height:var(--cell-size); object-fit:cover; display:block;
    border:0.2mm solid #999;
  }
  .cell .num{ font-size:9pt; font-weight:700; margin-top:1mm; line-height:1.2; }

  /* -------- ラベル用紙(40面・30mm角)専用の固定配置 -------- */
  #grid.label-mode{ display:block; padding:0; }
  .label-page{
    position:relative; width:210mm; height:297mm; background:#fff;
    page-break-after:always;
  }
  .label-page:last-child{ page-break-after:auto; }
  .label-cell{ position:absolute; width:30mm; height:30mm; }
  .label-cell img{ width:30mm; height:30mm; object-fit:cover; display:block; }
  .label-cell .num{
    position:absolute; right:0; bottom:0; left:0; text-align:center;
    font-size:7pt; font-weight:700; color:#000; background:rgba(255,255,255,0.82);
    line-height:1.5;
  }
  .row-label{
    position:absolute; width:16mm; text-align:right;
    font-size:7pt; color:#666; line-height:1;
  }

  @media print {
    #toolbar{ display:none !important; }
    #status{ display:none !important; }
    @page{ size: A4; margin: 0; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <div class="title" id="toolbarTitle">屋根マーク 写真印刷シート(3cm×3cm・A4)</div>
  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <div id="typeToggle">
      <button class="type-opt active" data-type="yane">屋根マーク</button>
      <button class="type-opt" data-type="semi">ぬけがら</button>
    </div>
    <div id="layoutToggle">
      <button class="layout-opt active" data-layout="flow">自由に並べる</button>
      <button class="layout-opt" data-layout="label40">ラベル用紙(40面)</button>
    </div>
    <div id="sizeToggle">
      <button class="size-opt active" data-size="30">3cm</button>
      <button class="size-opt" data-size="20">2cm</button>
    </div>
    <a class="btn btn-back" href="index.html">地図に戻る</a>
    <button class="btn btn-go" id="goBtn">印刷する</button>
  </div>
</div>
<div id="status">読み込み中…</div>
<div id="grid"></div>

<script>
const DB_NAME = "gsiFieldMapDB";
const DB_VERSION = 1;
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains("tiles")) db.createObjectStore("tiles");
      if(!db.objectStoreNames.contains("points")) db.createObjectStore("points", {keyPath:"id"});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGetAll(store){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, "readonly");
    const r = tx.objectStore(store).getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

let currentType = "yane";
let layoutMode = "flow"; // "flow" | "label40"
let allPoints = null;

/* ラベル用紙(40面・30mm角)の固定寸法 */
const LABEL = { cols: 5, rows: 8, cellMm: 30, gapMm: 4, marginTopMm: 14.5, marginLeftMm: 22 };

function renderGrid(){
  if(layoutMode === "label40") renderLabelGrid();
  else renderFlowGrid();
}

function renderFlowGrid(){
  const statusEl = document.getElementById("status");
  const grid = document.getElementById("grid");
  grid.className = "";
  grid.innerHTML = "";

  if(!allPoints){
    statusEl.textContent = "データを読み込めませんでした。地図アプリを一度開いてから、もう一度お試しください。";
    return;
  }

  const typeLabel = currentType === "yane" ? "屋根マーク" : "ぬけがら";
  const typePoints = allPoints.filter(p => p.surveyType === currentType);
  const withPhoto = typePoints.filter(p => p.photo);
  const withoutPhoto = typePoints.length - withPhoto.length;
  withPhoto.sort((a,b) => (parseInt(a.number,10)||0) - (parseInt(b.number,10)||0));

  if(withPhoto.length === 0){
    statusEl.textContent = `${typeLabel}で、写真が登録されている地点がありません。`;
    return;
  }

  statusEl.textContent = `${typeLabel}の写真 ${withPhoto.length} 件を並べました。` +
    (withoutPhoto > 0 ? `(写真のない地点 ${withoutPhoto} 件は除外)` : "");

  withPhoto.forEach(p => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = `<img src="${p.photo}"><div class="num">${escapeHtml(p.number || "")}</div>`;
    grid.appendChild(cell);
  });
}

function renderLabelGrid(){
  const statusEl = document.getElementById("status");
  const grid = document.getElementById("grid");
  grid.className = "label-mode";
  grid.innerHTML = "";

  if(!allPoints){
    statusEl.textContent = "データを読み込めませんでした。地図アプリを一度開いてから、もう一度お試しください。";
    return;
  }

  const typeLabel = currentType === "yane" ? "屋根マーク" : "ぬけがら";
  const typePoints = allPoints.filter(p => p.surveyType === currentType);
  const withPhoto = typePoints.filter(p => p.photo);
  const withoutPhoto = typePoints.length - withPhoto.length;
  withPhoto.sort((a,b) => (parseInt(a.number,10)||0) - (parseInt(b.number,10)||0));

  if(withPhoto.length === 0){
    statusEl.textContent = `${typeLabel}で、写真が登録されている地点がありません。`;
    return;
  }

  const perPage = LABEL.cols * LABEL.rows;
  const pageCount = Math.ceil(withPhoto.length / perPage);
  statusEl.textContent = `${typeLabel}の写真 ${withPhoto.length} 件を、1ページ${perPage}面のラベル用紙 ${pageCount}ページぶんに並べました。` +
    (withoutPhoto > 0 ? `(写真のない地点 ${withoutPhoto} 件は除外)` : "");

  for(let pageIndex = 0; pageIndex < pageCount; pageIndex++){
    const page = document.createElement("div");
    page.className = "label-page";

    /* 左欄外に、その用紙内での行番号(1〜8)を小さく書く */
    for(let row = 0; row < LABEL.rows; row++){
      const rowLabel = document.createElement("div");
      rowLabel.className = "row-label";
      const top = LABEL.marginTopMm + row * (LABEL.cellMm + LABEL.gapMm);
      rowLabel.style.top = (top + LABEL.cellMm/2 - 2) + "mm";
      rowLabel.style.left = "2mm";
      rowLabel.textContent = String(row + 1);
      page.appendChild(rowLabel);
    }

    const pagePoints = withPhoto.slice(pageIndex * perPage, pageIndex * perPage + perPage);
    pagePoints.forEach((p, i) => {
      const col = i % LABEL.cols;
      const row = Math.floor(i / LABEL.cols);
      const left = LABEL.marginLeftMm + col * (LABEL.cellMm + LABEL.gapMm);
      const top = LABEL.marginTopMm + row * (LABEL.cellMm + LABEL.gapMm);
      const cell = document.createElement("div");
      cell.className = "label-cell";
      cell.style.left = left + "mm";
      cell.style.top = top + "mm";
      cell.innerHTML = `<img src="${p.photo}"><div class="num">${escapeHtml(p.number || "")}</div>`;
      page.appendChild(cell);
    });

    grid.appendChild(page);
  }
}

(async function(){
  try {
    allPoints = await idbGetAll("points");
  } catch(e){
    allPoints = null;
  }
  renderGrid();
})();

document.getElementById("goBtn").addEventListener("click", () => window.print());

document.querySelectorAll("#sizeToggle .size-opt").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#sizeToggle .size-opt").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const mm = btn.getAttribute("data-size");
    document.documentElement.style.setProperty("--cell-size", mm + "mm");
    updateTitle();
  });
});

document.querySelectorAll("#typeToggle .type-opt").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#typeToggle .type-opt").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.getAttribute("data-type");
    updateTitle();
    renderGrid();
  });
});

document.querySelectorAll("#layoutToggle .layout-opt").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#layoutToggle .layout-opt").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    layoutMode = btn.getAttribute("data-layout");
    document.getElementById("sizeToggle").style.display = (layoutMode === "label40") ? "none" : "flex";
    updateTitle();
    renderGrid();
  });
});

function updateTitle(){
  const typeLabel = currentType === "yane" ? "屋根マーク" : "ぬけがら";
  if(layoutMode === "label40"){
    document.getElementById("toolbarTitle").textContent = `${typeLabel} 写真印刷シート(ラベル用紙40面・3cm角・A4)`;
    return;
  }
  const mm = document.querySelector("#sizeToggle .size-opt.active").getAttribute("data-size");
  document.getElementById("toolbarTitle").textContent =
    `${typeLabel} 写真印刷シート(${mm==="30"?"3":"2"}cm×${mm==="30"?"3":"2"}cm・A4)`;
}
</script>
</body>
</html>
