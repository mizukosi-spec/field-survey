<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写真印刷シート — フィールド調べ</title>
<style>
  :root{ --bg:#0f141c; --panel:#1c2430; --accent:#ffb84d; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background:#fff; }
  #toolbar{
    position:sticky; top:0; z-index:2;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:12px 14px; padding-top:calc(12px + env(safe-area-inset-top));
    background:var(--panel); color:#fff;
  }
  #toolbar .title{ font-size:14px; font-weight:700; }
  #toolbar .btn{
    border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer;
    text-decoration:none; display:inline-block;
  }
  .btn-back{ background:#333d4a; color:#fff; }
  .btn-go{ background:var(--accent); color:#1a0e0a; }
  #status{ padding:14px; color:#555; font-size:13px; }
  #grid{
    display:flex; flex-wrap:wrap; gap:2mm;
    padding:10mm; background:#fff;
  }
  .cell{
    width:30mm; break-inside:avoid; page-break-inside:avoid;
    text-align:center; color:#000;
  }
  .cell img{
    width:30mm; height:30mm; object-fit:cover; display:block;
    border:0.2mm solid #999;
  }
  .cell .num{ font-size:9pt; font-weight:700; margin-top:1mm; line-height:1.2; }
  @media print {
    #toolbar{ display:none !important; }
    #status{ display:none !important; }
    @page{ size: A4; margin: 8mm; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <div class="title">写真印刷シート(3cm×3cm・A4)</div>
  <div style="display:flex; gap:8px;">
    <a class="btn btn-back" href="index.html">地図に戻る</a>
    <button class="btn btn-go" id="goBtn">印刷する</button>
  </div>
</div>
<div id="status">読み込み中…</div>
<div id="grid"></div>

<script>
const DB_NAME = "gsiFieldMapDB";
const DB_VERSION = 1;
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains("tiles")) db.createObjectStore("tiles");
      if(!db.objectStoreNames.contains("points")) db.createObjectStore("points", {keyPath:"id"});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGetAll(store){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, "readonly");
    const r = tx.objectStore(store).getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

(async function(){
  const statusEl = document.getElementById("status");
  const grid = document.getElementById("grid");
  let points = [];
  try {
    points = await idbGetAll("points");
  } catch(e){
    statusEl.textContent = "データを読み込めませんでした。地図アプリを一度開いてから、もう一度お試しください。";
    return;
  }
  const withPhoto = points.filter(p => p.photo);
  const withoutPhoto = points.length - withPhoto.length;
  withPhoto.sort((a,b) => {
    if(a.surveyType !== b.surveyType) return a.surveyType === "yane" ? -1 : 1;
    return (parseInt(a.number,10)||0) - (parseInt(b.number,10)||0);
  });

  if(withPhoto.length === 0){
    statusEl.textContent = "写真が登録されている地点がありません。";
    return;
  }

  statusEl.textContent = `写真 ${withPhoto.length} 件を並べました。` +
    (withoutPhoto > 0 ? `(写真のない地点 ${withoutPhoto} 件は除外)` : "");

  withPhoto.forEach(p => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = `<img src="${p.photo}"><div class="num">${escapeHtml(p.number || "")}</div>`;
    grid.appendChild(cell);
  });
})();

document.getElementById("goBtn").addEventListener("click", () => window.print());
</script>
</body>
</html>
